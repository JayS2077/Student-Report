<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Card Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <section class="input-panel">
            <h2>Enter Grades</h2>
            <input type="text" id="studentName" placeholder="Student Name">
            <input type="number" class="score" placeholder="Math Score">
            <input type="number" class="score" placeholder="Science Score">
            <input type="number" class="score" placeholder="English Score">
            <input type="number" class="score" placeholder="Tech Score">
            <button id="generateBtn">Generate Report</button>
        </section>
        
        <section class="report-panel" id="reportCard">
            <div class="report-header">
                <h3>Academic Report Card</h3>
                <p id="resName">Student Name: ---</p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Total Score</th>
                        <th>Average</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="resTotal">0</td>
                        <td id="resAvg">0%</td>
                        <td id="resStatus">---</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>
    
    <script src="script.js"></script>
</body>        
</html>
